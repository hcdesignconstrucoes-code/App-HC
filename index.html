/* ======== Cloud: sincronização com Supabase ======== */
window.Cloud=(function(){
 const C={sb:null,user:null,ready:false,pending:{},timer:0,status:'',listeners:new Set(),last:{}};
 const conf=()=>{const h=window.HC_CONFIG||{};let u=h.SUPABASE_URL,k=h.SUPABASE_ANON_KEY;if(!u||!k){try{const s=JSON.parse(localStorage.getItem('hc-sb-conf')||'null');if(s){u=s.url;k=s.key}}catch(e){}}return u&&k?{url:u.trim(),key:k.trim()}:null};
 C.conf=conf;
 C.emit=s=>{C.status=s;C.listeners.forEach(f=>{try{f(s)}catch(e){}})};
 C.init=()=>{const c=conf();if(!c||!window.supabase)return false;try{C.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){C.sb=null;return false}};
 C.KEYS=['obras-hc1','mats-hc1','mos-hc1','tars-hc1','orcs-hc1','base-hc1','cfg-obras-hc1'];
 C.pull=async()=>{const {data,error}=await C.sb.from('app_data').select('key,value,updated_at');if(error)throw error;
  const map={};(data||[]).forEach(r=>{map[r.key]=r});
  // primeira vez nesta conta: envia o que houver neste aparelho
  if(!data||!data.length){const rows=C.KEYS.map(k=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?null:{key:k,value:v}}catch(e){return null}}).filter(Boolean);if(rows.length){const {error:e2}=await C.sb.from('app_data').upsert(rows.map(r=>({...r,user_id:C.user.id,updated_at:new Date().toISOString()})));if(e2)throw e2}return}
  Object.keys(map).forEach(k=>{const j=JSON.stringify(map[k].value);C.lastJ[k]=j;try{localStorage.setItem(k,j)}catch(e){};C.last[k]=map[k].updated_at})};
 C.flush=async()=>{clearTimeout(C.timer);const ks=Object.keys(C.pending);if(!ks.length||!C.sb||!C.user)return;
  const rows=ks.map(k=>({user_id:C.user.id,key:k,value:C.pending[k],updated_at:new Date().toISOString()}));C.pending={};C.emit('A guardar…');
  const {error}=await C.sb.from('app_data').upsert(rows);
  if(error){rows.forEach(r=>{if(!(r.key in C.pending))C.pending[r.key]=r.value});C.emit('Erro a guardar — nova tentativa…');C.timer=setTimeout(C.flush,5000)}
  else{rows.forEach(r=>{C.last[r.key]=r.updated_at});C.emit('Guardado na nuvem ✓')}};
 C.lastJ={};C.save=(k,v)=>{if(!C.ready)return;const j=JSON.stringify(v);if(C.lastJ[k]===j)return;C.lastJ[k]=j;C.pending[k]=v;clearTimeout(C.timer);C.timer=setTimeout(C.flush,900)};
 C.checkNew=async()=>{if(!C.ready||Object.keys(C.pending).length)return false;try{const {data}=await C.sb.from('app_data').select('key,updated_at');return (data||[]).some(r=>C.last[r.key]&&Date.parse(r.updated_at)>Date.parse(C.last[r.key])+1)}catch(e){return false}};
 // anexos no Storage
 C.upload=async file=>{const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);const safe=(file.name||'ficheiro').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-');const path=C.user.id+'/'+id+'-'+safe;
  const {error}=await C.sb.storage.from('anexos').upload(path,file,{contentType:file.type||undefined,upsert:false});if(error)throw error;return {kind:'sb',id:path,path,name:file.name,type:file.type,size:file.size}};
 C.url=async a=>{const {data,error}=await C.sb.storage.from('anexos').createSignedUrl(a.path,3600);if(error)throw error;return data.signedUrl};
 C.remove=async a=>{try{await C.sb.storage.from('anexos').remove([a.path])}catch(e){}};
 window.addEventListener('beforeunload',()=>{if(Object.keys(C.pending).length)C.flush()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')C.flush()});
 return C})();

function BarsChart({data,cfg,la,lb}){
 const [tip,setTip]=useState(null);

 const gw=(W-pl)/data.length,bw=gw*0.26;
 return html`<div>
  <svg viewBox=${'0 0 '+W+' '+H} className="w-full" style=${{color:'var(--mut)'}}>
   ${[0,.25,.5,.75,1].map(t=>t*max).map((t,i)=>html`<g key=${i}><line x1=${pl} x2=${W} y1=${y(t)} y2=${y(t)} stroke="currentColor" opacity=".2"/><text x=${pl-6} y=${y(t)+4} fontSize="11" textAnchor="end" fill="currentColor">${Math.round(t/1000)}k</text></g>`)}
   ${data.map((d,i)=>{const x0=pl+i*gw+gw/2;return html`<g key=${i} onMouseEnter=${()=>setTip(d)} onClick=${()=>setTip(d)} style=${{cursor:'pointer'}}>
     <rect x=${x0-bw-3} y=${y(d.orc)} width=${bw} height=${H-pb-y(d.orc)} rx="5" fill=${cfg.azul}/>
     <rect x=${x0+3} y=${y(d.gasto)} width=${bw} height=${H-pb-y(d.gasto)} rx="5" fill=${d.gasto>d.orc?'var(--neg)':cfg.ouro}/>
     <text x=${x0} y=${H-12} fontSize="12" textAnchor="middle" fill="currentColor">${d.nome}</text></g>`})}
  </svg>
  <div className="flex gap-4 text-xs mut justify-center"><span><b style=${{color:cfg.azul}}>■</b> ${la||'Orçamento'}</span><span><b style=${{color:cfg.ouro}}>■</b> ${lb||'Gasto real'}</span></div>
  <div className="text-center text-sm mt-2 h-5">${tip?html`<b>${tip.nome}</b>: ${la||'orçado'} ${eur(tip.orc)} · ${lb||'gasto'} ${eur(tip.gasto)}`:html`<span className="mut">Toca numa barra para ver valores</span>`}</div>
 </div>`}

  alertas:html`<${Card} key='a' st=${true} cls='md:col-span-2'><div className='flex justify-between items-center mb-2'><h3 className='font-bold'>Alertas</h3><${Ver} go=${()=>setSel('alertas')}/></div>${al.length?al.map((a,i)=>html`<div key=${i} className='flex items-center gap-2 text-sm py-1'><b style=${{color:a[0]}}>●</b>${a[1]}</div>`):html`<div className='text-sm mut'>Tudo em ordem ✓</div>`}<//>`,

 if(sel)return html`<${DashDetail} k=${sel} obras=${obras} mats=${mats} mos=${mos} tars=${tars} gasto=${gasto} cfg=${cfg} al=${al} open=${open} back=${()=>setSel(null)}/>`;

const parOf=(base,cat)=>(base.params&&base.params[cat])||{mat:0,mo:0,mm:0,ind:0,buf:0,forn:0,sub:0};
function calcItem(it,P){
 const D=num(it.mat),H=num(it.mo),qt=num(it.qt),sub=!!it.sub;
 const E=(H===0||sub)?P.forn:P.mat,F=D+D*E;
 const J=sub?P.sub:P.mo,K=H+H*J;
 const L=(D===0||H===0)?0:D+H,N=P.mm*L;
 const sb=F+K+N,Pp=sb+P.ind*sb,Ra=Pp+P.buf*Pp;
 const man=it.rman!==''&&it.rman!=null&&!isNaN(+it.rman);
 const R=man?+it.rman:Ra,S=R-(D+H),T=(D+H)?S/(D+H):0;
 return {D,H,E,F,J,K,L,N,sb,Pp,Ra,R,S,T,man,qt,ind:Pp-sb,buf:Ra-Pp,Y:qt*R,custo:qt*(D+H),mat:qt*D,mo:qt*H};
}
function orcCalc(orc,base){
 const P=parOf(base,orc.cat);
 const caps=orc.caps.map(c=>{const its=c.itens.map(i=>({i,c:calcItem(i,P)}));const s=f=>its.reduce((a,x)=>a+f(x),0);return {c,its,total:s(x=>x.c.Y),custo:s(x=>x.c.custo),mat:s(x=>x.c.mat),mo:s(x=>x.c.mo)}});
 const s=f=>caps.reduce((a,x)=>a+f(x),0);
 const tot=s(x=>x.total),custo=s(x=>x.custo),iva=tot*num(orc.iva)/100;
 return {P,caps,tot,iva,totIva:tot+iva,mat:s(x=>x.mat),mo:s(x=>x.mo),custo,marg:tot-custo,margP:custo?(tot-custo)/custo:0};
}
const orcForObra=(orcs,id)=>orcs.filter(o=>o.obra===id).sort((a,b)=>b.versao-a.versao)[0];
const itemOpts=(orcs,obraId)=>{const o=orcForObra(orcs,obraId);if(!o)return [];return o.caps.flatMap((c,ci)=>c.itens.map((i,ii)=>({id:i.id,label:(ci+1)+'.'+(ii+1)+' · '+(i.descr||'Sem descrição').slice(0,48)})))};
function ItemSel({v,onChange,orcs,obra}){const op=itemOpts(orcs,obra);return html`<select className="inp" value=${v||''} disabled=${!op.length} onChange=${e=>onChange(e.target.value)}><option value="">${op.length?'— Sem ligação —':'Obra sem orçamento'}</option>${op.map(o=>html`<option key=${o.id} value=${o.id}>${o.label}</option>`)}</select>`}

const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('gestao-anexos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('f',mode);const r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
 return {put:(k,b)=>run('readwrite',s=>s.put(b,k)),get:k=>run('readonly',s=>s.get(k)),del:k=>run('readwrite',s=>s.delete(k))}})();

}

/* leitura automática no servidor (Vercel /api/ler-fatura) */
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function prepFile(file){
 if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||'')){if(file.size>4e6)throw new Error('PDF demasiado grande (máx. 4 MB).');return {type:'application/pdf',data:b64(await file.arrayBuffer())}}
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('Imagem não suportada.'));i.src=url});
  const M=2000,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  return {type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}}finally{URL.revokeObjectURL(url)}}
async function lerServidor(file){
 const f=await prepFile(file);let tok='';
 try{if(window.Cloud&&window.Cloud.sb){const {data}=await window.Cloud.sb.auth.getSession();tok=(data&&data.session&&data.session.access_token)||''}}catch(e){}
 const r=await fetch('/api/ler-fatura',{method:'POST',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:JSON.stringify(f)});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok||!j)throw new Error((j&&j.erro)||('erro '+r.status));if(j.erro)throw new Error(j.erro);return j}
const mapFat=(r,file)=>{const ivaV=r.iva_valor==null?null:num(r.iva_valor);let liq=num(r.liquido),tot=num(r.total);
 let ivaP=r.iva_pct!=null?num(r.iva_pct):(liq&&ivaV!=null?ivaV/liq*100:23);
 if(!liq&&tot)liq=tot/(1+ivaP/100);if(liq&&tot&&r.iva_pct==null&&ivaV==null)ivaP=(tot/liq-1)*100;
 ivaP=Math.round(ivaP*100)/100;
 return {forn:String(r.fornecedor||'').slice(0,80),data:ptDate(r.data),nf:String(r.numero||'').slice(0,40),artigo:String(r.artigo||(file.name||'Fatura importada').replace(/\.[^.]+$/,'')).slice(0,120),qtd:1,preco:Math.round(liq*100)/100,iva:ivaP,cat:CATS.includes(r.categoria)?r.categoria:'Outros',nif:r.nif_fornecedor||'',lido:'auto'}};
async function lerFatura(file){
 const hoje=new Date().toISOString().slice(0,10);let err='';
 try{const r=await lerServidor(file);if(r&&(num(r.total)||num(r.liquido)))return mapFat(r,file);err='Não encontrei valores na fatura.'}catch(e){err=(e&&e.message)||'erro'}
 return {forn:'',data:hoje,nf:'',artigo:(file.name||'Fatura importada').replace(/\.[^.]+$/,''),qtd:1,preco:0,iva:23,cat:'Outros',lido:'manual',err};
}

 return html`<${Sec} t="Conta na nuvem"><div className="text-sm">Ligado como <b>${C.user.email}</b></div><div className="text-xs mut mt-1">Os dados ficam sincronizados entre os teus aparelhos.</div><button className="btn2 mt-2" onClick=${async()=>{await C.flush();await C.sb.auth.signOut();location.reload()}}>Terminar sessão</button><//>`}
function SyncBar(){
 const C=window.Cloud;const [s,setS]=useState(C.status);const [novo,setNovo]=useState(false);
 useEffect(()=>{const f=x=>setS(x);C.listeners.add(f);let t;const chk=async()=>{if(document.visibilityState==='visible'&&await C.checkNew())setNovo(true)};document.addEventListener('visibilitychange',chk);window.addEventListener('focus',chk);t=setInterval(chk,60000);return()=>{C.listeners.delete(f);document.removeEventListener('visibilitychange',chk);window.removeEventListener('focus',chk);clearInterval(t)}},[]);
 useEffect(()=>{if(s&&s.indexOf('✓')>=0){const t=setTimeout(()=>setS(''),2500);return()=>clearTimeout(t)}},[s]);
 if(novo)return html`<div className="fixed z-50 left-1/2 -translate-x-1/2 card flex items-center gap-3 text-sm" style=${{bottom:'calc(84px + env(safe-area-inset-bottom,0px))',padding:'10px 14px',boxShadow:'0 10px 30px -10px rgba(0,0,0,.4)'}}><span>Há alterações feitas noutro aparelho.</span><button className="btn" style=${{padding:'6px 12px'}} onClick=${async()=>{await C.pull();location.reload()}}>Atualizar</button></div>`;
 if(!s)return null;
 return html`<div className="fixed z-40 right-3 text-xs font-semibold px-3 py-1.5 rounded-full" style=${{bottom:'calc(84px + env(safe-area-inset-bottom,0px))',background:'var(--card)',border:'1px solid var(--bd)',color:s.indexOf('Erro')>=0?RED:'var(--mut)'}}>${s}</div>`}
function Shell({children}){return html`<div className="min-h-screen flex items-center justify-center p-5"><div className="card w-full" style=${{maxWidth:420}}><div className="text-[11px] uppercase tracking-widest mut font-semibold">${loadCfg().empresa}</div><h1 className="text-2xl font-extrabold tracking-tight mb-4">Gestão de Obras</h1>${children}</div></div>`}
function Setup({done}){
 const [u,setU]=useState('');const [k,setK]=useState('');
 return html`<${Shell}><div className="text-sm mut mb-3">Liga a app ao teu projeto Supabase para guardar os dados na nuvem e usá-los em vários aparelhos.</div>
  <${F2} l="Project URL"><input className="inp" placeholder="https://xxxx.supabase.co" value=${u} onChange=${e=>setU(e.target.value)}/><//>
  <div className="mt-2"><${F2} l="Chave anon / publishable"><input className="inp" value=${k} onChange=${e=>setK(e.target.value)}/><//></div>
  <button className="btn w-full mt-4" onClick=${()=>{if(!u||!k)return;try{localStorage.setItem('hc-sb-conf',JSON.stringify({url:u,key:k}))}catch(e){};location.reload()}}>Ligar</button>
  <button className="btn2 w-full mt-2" onClick=${()=>{try{localStorage.setItem('hc-local','1')}catch(e){};done()}}>Usar só neste aparelho</button><//>`}
function Login({onIn}){
 const [e,setE]=useState('');const [p,setP]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);
 const C=window.Cloud;
 const go=async novo=>{if(!e||!p){setMsg('Escreve o email e a palavra-passe.');return}setBusy(true);setMsg('');
  try{const r=novo?await C.sb.auth.signUp({email:e.trim(),password:p}):await C.sb.auth.signInWithPassword({email:e.trim(),password:p});
   if(r.error)throw r.error;
   if(!r.data.session){setMsg('Conta criada. Confirma o email que recebeste e depois entra.');setBusy(false);return}
   onIn(r.data.session)}catch(x){const m=(x&&x.message)||'';setMsg(/Invalid login/i.test(m)?'Email ou palavra-passe errados.':/already registered/i.test(m)?'Este email já tem conta. Usa "Entrar".':/Password should/i.test(m)?'A palavra-passe tem de ter pelo menos 6 caracteres.':/confirm/i.test(m)?'Confirma primeiro o teu email.':'Erro: '+m)}
  setBusy(false)};
 return html`<${Shell}>
  <${F2} l="Email"><input className="inp" type="email" autoComplete="email" value=${e} onChange=${x=>setE(x.target.value)}/><//>
  <div className="mt-2"><${F2} l="Palavra-passe"><input className="inp" type="password" autoComplete="current-password" value=${p} onChange=${x=>setP(x.target.value)} onKeyDown=${x=>x.key==='Enter'&&go(false)}/><//></div>
  ${msg&&html`<div className="text-sm mt-3 font-semibold">${msg}</div>`}
  <button className="btn w-full mt-4" disabled=${busy} onClick=${()=>go(false)}>${busy?'A entrar…':'Entrar'}</button>
  <button className="btn2 w-full mt-2" disabled=${busy} onClick=${()=>go(true)}>Criar conta</button><//>`}
function Root(){
 const C=window.Cloud;
 const [st,setSt]=useState('boot');const [err,setErr]=useState('');
 const start=async session=>{setSt('boot');try{C.user=session.user;await C.pull();C.ready=true;setSt('app')}catch(x){setErr((x&&x.message)||'erro');setSt('erro')}};
 useEffect(()=>{(async()=>{
  let local=false;try{local=localStorage.getItem('hc-local')==='1'}catch(e){}
  if(!C.init()){setSt(C.conf()?'erro':local?'app':'setup');if(C.conf())setErr('Não foi possível carregar o Supabase.');return}
  const {data}=await C.sb.auth.getSession();if(data&&data.session)start(data.session);else setSt('login');
  C.sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&C.ready)location.reload()});
 })()},[]);
 if(st==='boot')return html`<div className="min-h-screen flex items-center justify-center mut text-sm">A carregar…</div>`;
 if(st==='setup')return html`<${Setup} done=${()=>setSt('app')}/>`;
 if(st==='login')return html`<${Login} onIn=${start}/>`;
 if(st==='erro')return html`<${Shell}><div className="text-sm">Não foi possível ligar à base de dados: <b>${err}</b></div><div className="text-xs mut mt-2">Confirma se correste o ficheiro supabase-setup.sql no Supabase e se o URL e a chave estão certos.</div><button className="btn w-full mt-4" onClick=${()=>location.reload()}>Tentar de novo</button><button className="btn2 w-full mt-2" onClick=${()=>{try{localStorage.removeItem('hc-sb-conf')}catch(e){};location.reload()}}>Mudar URL / chave</button><//>`;
 return html`<${React.Fragment}><${App}/>${C.ready&&html`<${SyncBar}/>`}<//>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
</script>
</body>
</html>
