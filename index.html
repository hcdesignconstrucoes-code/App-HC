<script>
/* ======== Cloud: sincronização com Supabase ======== */
window.Cloud=(function(){
 const C={sb:null,user:null,ready:false,pending:{},timer:0,status:'',listeners:new Set(),last:{}};
 const conf=()=>{const h=window.HC_CONFIG||{};let u=h.SUPABASE_URL,k=h.SUPABASE_ANON_KEY;if(!u||!k){try{const s=JSON.parse(localStorage.getItem('hc-sb-conf')||'null');if(s){u=s.url;k=s.key}}catch(e){}}return u&&k?{url:u.trim(),key:k.trim()}:null};
 C.conf=conf;
 C.emit=s=>{C.status=s;C.listeners.forEach(f=>{try{f(s)}catch(e){}})};
 C.init=()=>{const c=conf();if(!c||!window.supabase)return false;try{C.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){C.sb=null;return false}};
 C.KEYS=['obras-hc1','mats-hc1','mos-hc1','tars-hc1','orcs-hc1','base-hc1','cfg-obras-hc1','cofre-hc1','fixas-hc1','trab-hc1','fxl-hc1','pastas-hc1','subs-hc1'];
 C.pull=async()=>{const {data,error}=await C.sb.from('app_data').select('key,value,updated_at');if(error)throw error;
  const map={};(data||[]).forEach(r=>{map[r.key]=r});
  // primeira vez nesta conta: envia o que houver neste aparelho
  if(!data||!data.length){const rows=C.KEYS.map(k=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?null:{key:k,value:v}}catch(e){return null}}).filter(Boolean);if(rows.length){const {error:e2}=await C.sb.from('app_data').upsert(rows.map(r=>({...r,user_id:C.user.id,updated_at:new Date().toISOString()})));if(e2)throw e2}return}
  Object.keys(map).forEach(k=>{const j=JSON.stringify(map[k].value);C.lastJ[k]=j;try{localStorage.setItem(k,j)}catch(e){};C.last[k]=map[k].updated_at})};
 C.flush=async()=>{clearTimeout(C.timer);const ks=Object.keys(C.pending);if(!ks.length||!C.sb||!C.user)return;
  const rows=ks.map(k=>({user_id:C.user.id,key:k,value:C.pending[k],updated_at:new Date().toISOString()}));C.pending={};C.emit('A guardar…');
  const {error}=await C.sb.from('app_data').upsert(rows);
  if(error){console.error('HC guardar',error);rows.forEach(r=>{if(!(r.key in C.pending))C.pending[r.key]=r.value});C.lastErr=(error.message||error.code||'erro')+(error.details?' · '+error.details:'')+(error.hint?' · '+error.hint:'')+' ['+rows.map(r=>r.key).join(', ')+']';C.emit('Erro a guardar: '+C.lastErr);C.timer=setTimeout(C.flush,8000)}
  else{rows.forEach(r=>{C.last[r.key]=r.updated_at});C.emit('Guardado na nuvem ✓')}};
 C.lastJ={};C.save=(k,v)=>{if(!C.ready||v===null||v===undefined)return;const j=JSON.stringify(v);if(C.lastJ[k]===j)return;C.lastJ[k]=j;C.pending[k]=v;clearTimeout(C.timer);C.timer=setTimeout(C.flush,900)};
 C.checkNew=async()=>{if(!C.ready||Object.keys(C.pending).length)return false;try{const {data}=await C.sb.from('app_data').select('key,updated_at');return (data||[]).some(r=>C.last[r.key]&&Date.parse(r.updated_at)>Date.parse(C.last[r.key])+1)}catch(e){return false}};
 // anexos no Storage
 C.upload=async file=>{const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);const safe=(file.name||'ficheiro').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-');const path=C.user.id+'/'+id+'-'+safe;
  const {error}=await C.sb.storage.from('anexos').upload(path,file,{contentType:file.type||undefined,upsert:false});if(error)throw error;return {kind:'sb',id:path,path,name:file.name,type:file.type,size:file.size}};
 C.url=async a=>{const {data,error}=await C.sb.storage.from('anexos').createSignedUrl(a.path,3600);if(error)throw error;return data.signedUrl};
 C.remove=async a=>{try{await C.sb.storage.from('anexos').remove([a.path])}catch(e){}};
 window.addEventListener('beforeunload',()=>{if(Object.keys(C.pending).length)C.flush()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')C.flush()});
 return C})();
</script>

 td{display:flex!important;justify-content:space-between;align-items:center;gap:12px;border:0!important;padding:5px 0!important;width:100%!important;min-width:0!important;max-width:none!important;text-align:right}
 td{flex-wrap:wrap}
 td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);flex:0 1 auto;max-width:48%;text-align:left}
 td[data-l='']::before{display:none}
 td[data-l='']{justify-content:flex-end}
 td>.inp,td>select{flex:1;min-width:0;text-align:right}
 .overflow-x-auto{overflow-x:visible}
}

const parOf=(base,cat)=>(base.params&&base.params[cat])||{mat:0,mo:0,mm:0,ind:0,buf:0,forn:0,sub:0};
function calcItem(it,P){
 const D=num(it.mat),H=num(it.mo),qt=num(it.qt),sub=!!it.sub;
 const ov=k=>it[k]!==''&&it[k]!=null&&!isNaN(+it[k]);
 const E=ov('pMat')?+it.pMat:(H===0||sub)?P.forn:P.mat,F=D+D*E;
 const J=ov('pMo')?+it.pMo:sub?P.sub:P.mo,K=H+H*J;
 const L=(D===0||H===0)?0:D+H,N=P.mm*L;
 const sb=F+K+N,Pp=sb+P.ind*sb,Ra=Pp+P.buf*Pp;
 const man=it.rman!==''&&it.rman!=null&&!isNaN(+it.rman);
 const R=man?+it.rman:Ra,S=R-(D+H),T=(D+H)?S/(D+H):0;
 return {D,H,E,F,J,K,L,N,sb,Pp,Ra,R,S,T,man,qt,ind:Pp-sb,buf:Ra-Pp,Y:qt*R,custo:qt*(D+H),mat:qt*D,mo:qt*H};

function orcCalc(orc,base){

 const caps=orc.caps.map(c=>{const its=c.itens.map(i=>({i,c:calcItem(i,P)}));const s=f=>its.reduce((a,x)=>a+f(x),0);return {c,its,total:s(x=>x.c.Y),custo:s(x=>x.c.custo),mat:s(x=>x.c.mat),mo:s(x=>x.c.mo)}});
 const s=f=>caps.reduce((a,x)=>a+f(x),0);
 const tot=s(x=>x.total),custo=s(x=>x.custo),iva=tot*num(orc.iva)/100;
 return {P,caps,tot,iva,totIva:tot+iva,mat:s(x=>x.mat),mo:s(x=>x.mo),custo,marg:tot-custo,margP:custo?(tot-custo)/custo:0};

 const caps=o.caps.map(c=>c.nome||'');
 const votos={};lin.forEach(l=>{const c=(l.cap&&capMatch(l.cap,caps))||guessCap(l.nome,'',null);const cm=c&&capMatch(c,caps);if(cm)votos[cm]=(votos[cm]||0)+num(l.qtd||1)*num(l.preco||1)+0.01});
 let capNome=Object.keys(votos).sort((a,b)=>votos[b]-votos[a])[0]||'';
 if(!capNome){const g=guessCap(txt,m.cat,null);capNome=g?capMatch(g,caps):''}

/* ---- importar orçamento (PDF, Excel, CSV ou foto) ---- */
const isSheet=f=>/\.(xlsx|xlsm|xls|csv|ods)$/i.test(f.name||'')||/spreadsheet|excel|csv|opendocument/i.test(f.type||'');
function loadXLSX(){return new Promise((ok,ko)=>{if(window.XLSX)return ok(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?ok(window.XLSX):ko(new Error('Leitor de Excel não carregou.'));s.onerror=()=>ko(new Error('Não foi possível carregar o leitor de Excel.'));document.head.appendChild(s)})}
async function sheetText(file){if(/\.csv$/i.test(file.name||'')||/text\/csv/i.test(file.type||''))return (await file.text()).slice(0,180000);
 const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});
 return wb.SheetNames.map(n=>'### Folha: '+n+'\n'+X.utils.sheet_to_csv(wb.Sheets[n],{FS:';',blankrows:false})).join('\n\n').slice(0,180000)}
const capMatch=(n,caps)=>{const t=normTxt(n).replace(/[^a-z0-9]+/g,' ').trim();if(!t)return '';const e=caps.find(c=>normTxt(c).replace(/[^a-z0-9]+/g,' ').trim()===t);if(e)return e;const p=caps.find(c=>{const cc=normTxt(c).replace(/[^a-z0-9]+/g,' ').trim();return cc&&(t.includes(cc)||cc.includes(t))});return p||''};
function orcFromAI(r,base){
 const o=newOrc(base,null);o.nome=String(r.nome||r.cliente||'Orçamento importado').slice(0,120);o.morada=String(r.morada||'').slice(0,200);o.descricao=String(r.descricao||'').slice(0,1000);if(r.notas)o.notas=String(r.notas).slice(0,4000);
 const out=[];let n=0;
 (Array.isArray(r.capitulos)?r.capitulos:[]).forEach(c=>{const nome=capMatch(c&&c.nome,base.caps)||String((c&&c.nome)||'Outros').slice(0,60);let cap=out.find(x=>x.nome===nome);if(!cap){cap={id:uid(),nome,itens:[]};out.push(cap)}
  (Array.isArray(c&&c.itens)?c.itens:[]).forEach(it=>{if(!it||!String(it.descricao||'').trim())return;const q=num(it.quantidade)||1;let pu=num(it.preco_unitario);if(!pu&&num(it.total))pu=num(it.total)/q;
   const esp=base.espacos.find(e=>normTxt(e)===normTxt(it.espaco||''))||capMatch(it.espaco||'',base.espacos)||'Geral';const un=UNMAP(it.unidade||'');
   cap.itens.push({id:uid(),espaco:esp,descr:String(it.descricao).slice(0,3000),un:['UN','M2','M3','ML','KG','L','VG'].includes(un)?un:(un||'UN'),qt:q,mat:num(it.custo_material)||0,mo:num(it.custo_mao_obra)||0,sub:false,rman:pu?Math.round(pu*100)/100:''});n++})});
 o.caps=base.caps.map(nm=>out.find(c=>c.nome===nm)).filter(c=>c&&c.itens.length).concat(out.filter(c=>!base.caps.includes(c.nome)&&c.itens.length));
 return {o,n}}

const PED_TIPO={'Remodelação completa':['Demolições','Eletricidade','Canalização','Pavimento','Pintura','Carpintaria / portas'],'Casa de banho':['Demolições','Canalização','Impermeabilização','Pavimento','Azulejo / revestimentos','Pladur / tetos falsos','Louças de casa de banho'],'Cozinha':['Demolições','Canalização','Eletricidade','Pavimento','Azulejo / revestimentos','Cozinha nova'],'Pintura':['Pintura'],'Pavimentos':['Pavimento'],'Pladur / tetos':['Pladur / tetos falsos'],'Eletricidade':['Eletricidade'],'Canalização':['Canalização'],'Caixilharia':['Janelas / caixilharia']};
const PED_ESP=[[/banho|wc/,'Casas de Banho'],[/cozinha/,'Cozinhas'],[/sala/,'Salas'],[/quarto/,'Quartos'],[/corredor|hall/,'Corredores'],[/terraco/,'Terraços'],[/varanda/,'Varandas'],[/garagem/,'Garagens'],[/exterior/,'Zonas Exteriores']];
function orcFromPedido(pd,base){
 const o=newOrc(base,null);const N=x=>parseFloat(String(x||'').replace(',','.'))||0;const r2=x=>Math.round(x*100)/100;
 const D=String(pd.descricao||'');const linha=t=>{const L=D.split('\n');const i=L.findIndex(l=>l.trim()===t);return i>=0&&L[i+1]?L[i+1].trim():''};
 const lista=s=>String(s||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='—');
 const espDe=n=>{const t=normTxt(n);const e=PED_ESP.find(p=>p[0].test(t));const v=e?e[1]:'Geral';return base.espacos.includes(v)?v:(capMatch(v,base.espacos)||'Geral')};
 const divs=String(pd.medidas||'').split('\n').map(l=>{const m=l.match(/^(.+?):\s*([\d.,]+)\s*(?:×\s*([\d.,]+))?\s*m\b/);if(!m)return null;const c=N(m[2]),w=N(m[3]);const a=N((l.match(/p[ée]-direito\s*([\d.,]+)/i)||[])[1])||2.6;return {n:m[1].trim(),esp:espDe(m[1]),piso:c&&w?c*w:0,par:c&&w?2*(c+w)*a:0}}).filter(d=>d&&d.piso);
 const areaTot=N((D.match(/Área:\s*([\d.,]+)/)||[])[1]);
 const trab=lista(linha('— Trabalhos —')).map(n=>({n,so:null}));const TESP={'Casa de banho':'Casas de Banho','Cozinha':'Cozinhas'};lista(pd.tipo).forEach(t=>(PED_TIPO[t]||[]).forEach(x=>{const e=trab.find(y=>y.n===x);if(!e)trab.push({n:x,so:TESP[t]?[TESP[t]]:null});else if(e.so&&TESP[t]&&!e.so.includes(TESP[t]))e.so.push(TESP[t])}));
 const gama=(String(pd.materiais||'').match(/Gama:\s*([^·\n]+)/)||[])[1];
 const txt=(R,esp)=>{const e=normTxt(esp).replace(/s$/,'').split(' ').pop();let best=null,bs=0;(base.textos||[]).forEach(t=>{if(t.cap!==R.cap)return;const d=normTxt(t.descr);if(!R.k.some(k=>d.includes(k)))return;const tp=normTxt(t.tipo);let s=2;const esp2=/banho|wc|cozinha|lavandaria|entrada/;if(esp!=='Geral'&&e&&(tp.includes(e)||d.includes(e)))s+=2;else if(esp2.test(tp)||/\bwc\b/.test(d))return;if(s>bs){bs=s;best=t}});return best};
 const caps={};const add=(R,esp,un,qt,extra)=>{const t=txt(R,esp);(caps[R.cap]=caps[R.cap]||[]).push({id:uid(),espaco:esp,descr:((t?t.descr:R.t)+(extra||'')).slice(0,3000),un,qt:r2(qt)||1,mat:t?num(t.mat):0,mo:t?num(t.mo):0,sub:!!(t&&t.sub),rman:''})};
 trab.forEach(T=>{const R=PED_TRAB[T.n];if(!R)return;const dv=T.so?divs.filter(d=>T.so.includes(d.esp)):divs;if(T.so&&!dv.length&&divs.length)return;
  if(['piso','teto','parede','pint'].includes(R.m)){let ds=dv;if(R.so){const f=dv.filter(d=>R.so.includes(d.esp));ds=f.length?f:dv}
   if(ds.length)ds.forEach(d=>{const q=R.m==='parede'?d.par:R.m==='pint'&&d.esp!=='Casas de Banho'?d.par+d.piso:d.piso;add(R,d.esp,'M2',q)});
   else if(areaTot&&R.m!=='parede'&&!T.so)add(R,'Geral','M2',R.m==='pint'?areaTot*3.5:areaTot);else add(R,T.so?T.so[0]:'Geral','VG',1)}
  else if(R.m==='wc'){const w=divs.filter(d=>d.esp==='Casas de Banho');(w.length?w:[1]).forEach(()=>add(R,'Casas de Banho','VG',1))}
  else add(R,T.so?T.so[0]:'Geral',R.m==='un'?'UN':'VG',1)});
 o.caps=base.caps.filter(c=>caps[c]).map(c=>({id:uid(),nome:c,itens:caps[c]})).concat(Object.keys(caps).filter(c=>!base.caps.includes(c)).map(c=>({id:uid(),nome:c,itens:caps[c]})));
 if(!o.caps.length)o.caps=base.caps.map(n=>({id:uid(),nome:n,itens:[]}));
 const pedidoTxt=D.split('\n\n')[0].trim();const im=(D.match(/Tipo:[^\n]*/)||[''])[0];
 o.nome=String(pd.nome||'Cliente')+(pd.tipo?' — '+lista(pd.tipo)[0]:'');o.morada=pd.morada||'';
 o.descricao=[pedidoTxt,im&&im.replace(/ · /g,', ').replace(/—/g,'-'),gama&&gama.trim()!=='—'?'Acabamentos: '+gama.trim():''].filter(Boolean).join('\n').slice(0,1000);
 return o}
function ImportOrcBtn({base,importar}){
 const ref=useRef(null);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');
 const go=async f=>{if(!f)return;setBusy(true);setMsg('');try{const r=await lerOrcamento(f,base);if(r&&r.erro)throw new Error(r.erro);const {o,n}=orcFromAI(r||{},base);if(!n)throw new Error('Não encontrei trabalhos neste ficheiro.');importar(o)}catch(e){setMsg((e&&e.message)||'Não foi possível ler o ficheiro.');setTimeout(()=>setMsg(''),9000)}setBusy(false)};
 return html`<span className="inline-flex items-center gap-2 flex-wrap"><input ref=${ref} type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv,.ods,image/*,application/pdf" hidden onChange=${e=>{go(e.target.files[0]);e.target.value=''}}/>
  <${IB} ic="upl" t="Importar orçamento (PDF, Excel ou foto)" txt="Importar" on=${()=>!busy&&ref.current&&ref.current.click()}/>
  ${msg&&html`<span key=${msg} className="text-xs font-semibold st-msg" style=${{color:RED}}>${msg}</span>`}
  ${busy&&ReactDOM.createPortal(html`<div className="fixed inset-0 z-[85] flex items-center justify-center" style=${{background:'rgba(0,0,0,.45)'}}><div className="card text-center" style=${{padding:'22px 26px',maxWidth:320}}><div className="hcspin mx-auto mb-3"></div><b>A ler o orçamento…</b><div className="text-xs mut mt-1">Pode demorar até um minuto em orçamentos grandes.</div></div></div>`,document.body)}</span>`}
async function lerOrcamento(file,base){let body;
 if(isSheet(file))body={text:await sheetText(file),nome:file.name};
 else if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||'')){if(file.size>4e6)throw new Error('PDF demasiado grande (máx. 4 MB).');body={type:'application/pdf',data:b64(await file.arrayBuffer())}}
 else body=await prepFile(file);
 body.caps=base.caps;body.espacos=base.espacos;let tok='';
 try{if(window.Cloud&&window.Cloud.sb){const {data}=await window.Cloud.sb.auth.getSession();tok=(data&&data.session&&data.session.access_token)||''}}catch(e){}
 const r=await fetch('/api/ler-orcamento',{method:'POST',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:JSON.stringify(body)});
 let j=null;try{j=await r.json()}catch(e){}if(!r.ok||!j)throw new Error((j&&j.erro)||(r.status===504?'Demorou demasiado. Experimenta dividir o orçamento.':'erro '+r.status));return j}

   ${cp.its.map((t,ii)=>{const r=real(t.i.id),d=r-t.c.custo;return html`<div key=${t.i.id} className="py-2" style=${{borderTop:'1px solid var(--bd)'}}>

function ObraOrc({o,orcs,mats,mos,base,cfg,criarOrc,openOrc}){
 const orc=orcForObra(orcs,o.id);
 if(!orc)return html`<${Card} st=${true}><div className="flex flex-wrap items-center justify-between gap-3"><div><h3 className="font-bold">Orçamento por capítulo</h3><div className="text-sm mut">Esta obra ainda não tem orçamento ligado.</div></div><${IB} ic="plus" t="Criar orçamento" pri=${true} txt="Orçamento" on=${()=>criarOrc(o.id)}/></div><//>`;
 const R=orcCalc(orc,base);const mm=mats.filter(m=>m.obra===o.id),ll=mos.filter(m=>m.obra===o.id);
 const real=id=>mm.filter(m=>m.item===id).reduce((s,m)=>s+netM(m),0)+ll.filter(m=>m.item===id).reduce((s,m)=>s+moTot(m),0);
 const ids=new Set(orc.caps.flatMap(c=>[...c.itens.map(i=>i.id),'cap:'+c.id]));
 const sem=mm.filter(m=>!ids.has(m.item)).reduce((s,m)=>s+netM(m),0)+ll.filter(m=>!ids.has(m.item)).reduce((s,m)=>s+moTot(m),0);
 const lig=R.caps.reduce((s,cp)=>s+cp.its.reduce((a,t)=>a+real(t.i.id),0)+real('cap:'+cp.c.id),0),tg=lig+sem;
 const pct=R.tot?tg/R.tot*100:0;
 return html`<${Card} st=${true}>
  <div className="flex flex-wrap items-start justify-between gap-2 mb-1"><div><h3 className="font-bold">Orçamento vs. gasto real, por capítulo</h3><div className="text-xs mut">${orc.nome} · versão ${orc.versao} · valores sem IVA</div></div><${IB} ic="open" t="Abrir orçamento" on=${()=>openOrc(orc.id)}/></div>
  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 my-3 text-sm"><div><div className="text-xs mut">Orçamento (venda)</div><b>${eur(R.tot)}</b></div><div><div className="text-xs mut">Custo previsto</div><b>${eur(R.custo)}</b></div><div><div className="text-xs mut">Gasto real</div><b>${eur(tg)}</b></div><div><div className="text-xs mut">Ainda disponível</div><b>${eur(R.tot-tg)}</b></div></div>
  <${LucroBar} orc=${R.tot} g=${tg} cfg=${cfg}/><div className="text-xs mut mt-1 mb-3">${pct.toFixed(0)}% do orçamento de venda já gasto</div>
  <div className="space-y-2">${R.caps.map((cp,ci)=>({cp,ci})).filter(x=>x.cp.its.length||real('cap:'+x.cp.c.id)>0).map(x=>html`<${CapReal} key=${x.cp.c.id} cp=${x.cp} ci=${x.ci} real=${real} cfg=${cfg}/>`)}</div>
  ${sem>0&&html`<div className="text-sm mt-3 mut">Gasto ainda sem item do orçamento: <b style=${{color:'var(--fg)'}}>${eur(sem)}</b>. Liga cada fatura ou registo de mão-de-obra a um item para ver a comparação certa.</div>`}
 <//>`}

  ${msg&&html`<div className="text-sm mt-3 font-semibold">${msg}</div>`}
  <button className="btn w-full mt-4" disabled=${busy} onClick=${()=>go(false)}>${busy?'A entrar…':'Entrar'}</button>
  <button className="btn2 w-full mt-2" disabled=${busy} onClick=${()=>go(true)}>Criar conta</button>
  <button className="w-full mt-3 text-sm font-semibold" style=${{color:'var(--blue)'}} disabled=${busy} onClick=${async()=>{if(!e.trim()){setMsg('Escreve o teu email em cima e carrega outra vez aqui.');return}setBusy(true);setMsg('');try{const r=await C.sb.auth.resetPasswordForEmail(e.trim(),{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;setMsg('Enviámos um email para '+e.trim()+'. Abre o link desse email neste aparelho para escolheres uma palavra-passe nova.')}catch(x){setMsg('Não foi possível enviar: '+((x&&x.message)||'erro'))}setBusy(false)}}>Esqueci-me da palavra-passe</button><//>`}
function NovaPass({done}){
 const [p1,setP1]=useState('');const [p2,setP2]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);const C=window.Cloud;
 const go=async()=>{if(p1.length<6){setMsg('A palavra-passe tem de ter pelo menos 6 caracteres.');return}if(p1!==p2){setMsg('As duas palavras-passe não são iguais.');return}
  setBusy(true);try{const r=await C.sb.auth.updateUser({password:p1});if(r.error)throw r.error;try{history.replaceState(null,'',location.pathname)}catch(e){};const {data}=await C.sb.auth.getSession();done(data&&data.session)}catch(x){setMsg('Erro: '+((x&&x.message)||'tenta outra vez'))}setBusy(false)};
 return html`<${Shell}><div className="text-sm mut mb-3 text-center">Escolhe uma palavra-passe nova.</div>
  <${F2} l="Nova palavra-passe"><input className="inp" type="password" autoComplete="new-password" value=${p1} onChange=${e=>setP1(e.target.value)}/><//>
  <div className="mt-2"><${F2} l="Repetir"><input className="inp" type="password" autoComplete="new-password" value=${p2} onChange=${e=>setP2(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&go()}/><//></div>
  ${msg&&html`<div className="text-sm mt-3 font-semibold">${msg}</div>`}
  <button className="btn w-full mt-4" disabled=${busy} onClick=${go}>${busy?'A guardar…':'Guardar e entrar'}</button><//>`}
function Root(){
 const C=window.Cloud;
 const [st,setSt]=useState('boot');const [err,setErr]=useState('');
 const start=async session=>{setSt('boot');try{C.user=session.user;await C.pull();C.ready=true;setSt('app')}catch(x){setErr((x&&x.message)||'erro');setSt('erro')}};
 useEffect(()=>{(async()=>{
  let local=false;try{local=localStorage.getItem('hc-local')==='1'}catch(e){}
  if(!C.init()){setSt(C.conf()?'erro':local?'app':'setup');if(C.conf())setErr('Não foi possível carregar o Supabase.');return}
  const rec=/type=recovery/.test(location.hash||'')||/type=recovery/.test(location.search||'');
  C.sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')setSt('nova');if(ev==='SIGNED_OUT'&&C.ready)location.reload()});
  const {data}=await C.sb.auth.getSession();if(rec){setSt('nova');return}if(data&&data.session)start(data.session);else setSt('login');
 })()},[]);
 if(st==='boot')return html`<div className="min-h-screen flex items-center justify-center mut text-sm">A carregar…</div>`;
 if(st==='setup')return html`<${Setup} done=${()=>setSt('app')}/>`;
 if(st==='login')return html`<${Login} onIn=${start}/>`;
 if(st==='nova')return html`<${NovaPass} done=${ss=>ss?start(ss):setSt('login')}/>`;
 if(st==='erro')return html`<${Shell}><div className="text-sm">Não foi possível ligar à base de dados: <b>${err}</b></div><div className="text-xs mut mt-2">Confirma se correste o ficheiro supabase-setup.sql no Supabase e se o URL e a chave estão certos.</div><button className="btn w-full mt-4" onClick=${()=>location.reload()}>Tentar de novo</button><button className="btn2 w-full mt-2" onClick=${()=>{try{localStorage.removeItem('hc-sb-conf')}catch(e){};location.reload()}}>Mudar URL / chave</button><//>`;
 return html`<${React.Fragment}><${App}/>${C.ready&&html`<${SyncBar}/>`}<//>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
</script>
</body>
</html>
